<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>
      <form>
        <!-- write your html here-->
        <!-- 
          try writing out the requirements first as comments
        this will also help you fill in your PR message later-->
        
        <p>All feilds are requierd to complete.</p>
        <!-- add user details section with name ande email input
          add data validation and requirment attribute -->
        <fieldset>
          <legend>Customer</legend>
          <p>
            <label for="user">Name: </label>
            <input
              type="text"
              id="user"
              name="user-name"
              placeholder="Your name"
              title="String contains letters and spaces min length 2 characters"
              pattern="^([a-zA-Z ]{2,})$"
              required
            />
          </p>
          <p>
            <label for="email">E-mail:</label>
            <input
              type="email"
              id="email"
              name="user-mail"
              placeholder="mail@example.com"
            />
          </p>
        </fieldset>
        <!-- add t-shirts details section add input selectors for colour 
         and size of t-shirts with required attribute -->
        <fieldset>
          <legend>T-shirt</legend>
          <p>
            <label for="colour">Colour:</label>
            <select id="colour" name="shirt-colour" required>
              <option value="red">RED</option>
              <option value="green">GREEN</option>
              <option value="blue">BLUE</option>
            </select>
          </p>
          <p>
            <label for="size">Size:</label>
            <select id="size" name="shirt-size" required>
              <option value="xs">XS</option>
              <option value="s">S</option>
              <option value="m">M</option>
              <option value="l">L</option>
              <option value="Xl">XL</option>
              <option value="xxl">XXL</option>
            </select>
          </p>
        </fieldset>
      </form>
    </main>
    <footer>
      <!-- change to your name-->
      <h2>By Nikolai Romanov</h2>
    </footer>
  </body>
</html>
